# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron:  '0 */2 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1 # v1.146.0
        with:
          ruby-version: '3.3' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install package
        run: python3 -m pip install -r requirements.txt
      - name: Tests unitaires (parsing PDF, points, liens, notifications)
        run: |
          cd python_scripts
          python -m unittest discover tests
      - name: Restore Google credentials
        env:
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
        run: echo "$GOOGLE_CREDENTIALS_B64" | base64 --decode > credentials.json
      - name: Sync photos from Google Drive
        run: |
          cd python_scripts
          python sync_drive.py
      - name: Run update of website
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_KEY_DISQUS: ${{ secrets.API_KEY_DISQUS }}
          APP_ID: ${{ secrets.APP_ID }}
        # Les classements viennent des PDF déposés dans resultats_pdf/ (ou téléchargés depuis le calendrier UFOLEP).
        # Une erreur d'analyse ne doit pas empêcher le déploiement du site : elle est signalée en annotation.
        run: |
          rm -rf ../output.txt
          cd python_scripts
          python main.py > ../output.txt 2>&1 || echo "::error::main.py a échoué, voir le log ci-dessus"
          cat ../output.txt
          grep -E "^\[(ERROR|PDF|ALERTE|MAJ)\]" ../output.txt | sed 's/^/::warning::/' || true
          python notifications.py || echo "::warning::envoi des notifications en échec"
          rm -rf ../output.txt

      - name: Rebase on latest main (evite un push rejete apres un push manuel)
        run: git pull --rebase --autostash origin main || (git rebase --abort 2>/dev/null; true)
      - name: Save change in git
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Save change by CI
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
