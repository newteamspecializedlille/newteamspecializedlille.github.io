<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Redirection…</title>
  {%- assign target = page.redirect_to | relative_url -%}
  <meta http-equiv="refresh" content="0; url={{ target }}">
  <link rel="canonical" href="{{ target | absolute_url }}">
  <meta name="robots" content="noindex">
  <script>window.location.replace({{ target | jsonify }});</script>
</head>
<body>
  <p>Cette page a changé d'adresse : <a href="{{ target }}">{{ target }}</a>.</p>
</body>
</html>
